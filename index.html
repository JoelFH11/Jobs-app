<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Red Trabajo</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<h1 class="text-3xl font-bold mb-6 text-center">Red Trabajo</h1>

<div id="authSection" class="max-w-md mx-auto bg-white p-4 rounded shadow">

<h2 class="text-xl mb-4">Login / Sign Up</h2>

<input id="email" class="border p-2 w-full mb-2" placeholder="Email">
<input id="password" type="password" class="border p-2 w-full mb-2" placeholder="Password">

<select id="role" class="border p-2 w-full mb-3">
<option value="worker">Worker</option>
<option value="employer">Employer</option>
</select>

<button onclick="signup()" class="bg-green-500 text-white px-4 py-2 rounded w-full mb-2">Sign Up</button>
<button onclick="login()" class="bg-blue-500 text-white px-4 py-2 rounded w-full mb-2">Login</button>

<p id="error" class="text-red-500 text-sm mt-2"></p>

<button onclick="fillWorker()" class="bg-gray-500 text-white px-4 py-2 rounded w-full mt-2">
Use Worker Demo
</button>

<button onclick="fillEmployer()" class="bg-gray-700 text-white px-4 py-2 rounded w-full mt-2">
Use Employer Demo
</button>

</div>

<div id="appSection" class="hidden max-w-xl mx-auto">

<div class="flex justify-between mb-4">
<h2 class="text-xl">Dashboard</h2>
<button onclick="logout()" class="bg-red-500 text-white px-3 py-1 rounded">Logout</button>
</div>

<div id="employerPanel" class="hidden bg-white p-4 rounded shadow mb-4">

<h3 class="font-bold mb-2">Post Job</h3>

<input id="title" class="border p-2 w-full mb-2" placeholder="Job Title">
<input id="description" class="border p-2 w-full mb-2" placeholder="Description">
<input id="phone" class="border p-2 w-full mb-2" placeholder="Phone">

<button onclick="postJob()" class="bg-green-500 text-white px-4 py-2 rounded">Post Job</button>

</div>

<div class="bg-white p-4 rounded shadow">
<h3 class="font-bold mb-3">Available Jobs</h3>
<div id="jobs"></div>
</div>

</div>

<script type="module">

let auth, db;
let demoMode = false;

// TRY FIREBASE
try {

const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");

const { 
getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged 
} = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");

const { 
getFirestore, doc, setDoc, getDoc, addDoc, collection, getDocs 
} = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");

const firebaseConfig = {
apiKey: "PASTE_YOUR_REAL_KEY",
authDomain: "PASTE",
projectId: "PASTE",
storageBucket: "PASTE",
messagingSenderId: "PASTE",
appId: "PASTE"
};

const app = initializeApp(firebaseConfig);
auth = getAuth(app);
db = getFirestore(app);

// AUTH STATE
onAuthStateChanged(auth, async (user)=>{
if(user){
showApp();
}else{
showAuth();
}
});

window.signup = async function(){
try{
const email = val("email");
const password = val("password");
const role = val("role");

const user = await createUserWithEmailAndPassword(auth,email,password);

await setDoc(doc(db,"users",user.user.uid),{
role,
createdAt: Date.now()
});

}catch(e){
showError(e.message);
}
}

window.login = async function(){
try{
await signInWithEmailAndPassword(auth,val("email"),val("password"));
}catch(e){
showError(e.message);
}
}

window.logout = ()=>signOut(auth);

window.postJob = async function(){
try{
await addDoc(collection(db,"jobs"),{
title: val("title"),
description: val("description"),
phone: val("phone"),
createdAt: Date.now()
});
loadJobs();
}catch(e){
showError(e.message);
}
}

async function loadJobs(){
const jobsDiv = document.getElementById("jobs");
jobsDiv.innerHTML="";

const snapshot = await getDocs(collection(db,"jobs"));

snapshot.forEach(docu=>{
const job = docu.data();

if(Date.now() - job.createdAt < 604800000){

jobsDiv.innerHTML += `
<div class="border p-3 mb-2">
<h4 class="font-bold">${job.title}</h4>
<p>${job.description}</p>
<a href="tel:${job.phone}" class="text-blue-500">Call</a>
</div>`;
}
});
}

} catch (e) {

console.log("Firebase failed → Demo mode");

demoMode = true;

}

// DEMO MODE (WORKS WITHOUT FIREBASE)
if(demoMode){

let currentUser = null;
let jobs = [];

window.signup = ()=>{
currentUser = {role: val("role")};
showApp();
};

window.login = ()=>{
currentUser = {role: val("email").includes("employer") ? "employer":"worker"};
showApp();
};

window.logout = ()=>{
currentUser = null;
showAuth();
};

window.postJob = ()=>{
jobs.push({
title: val("title"),
description: val("description"),
phone: val("phone"),
createdAt: Date.now()
});
loadJobs();
};

function loadJobs(){
const jobsDiv = document.getElementById("jobs");
jobsDiv.innerHTML="";

jobs.forEach(job=>{
jobsDiv.innerHTML += `
<div class="border p-3 mb-2">
<h4 class="font-bold">${job.title}</h4>
<p>${job.description}</p>
<p>${job.phone}</p>
</div>`;
});
}

}

// UI HELPERS
function val(id){ return document.getElementById(id).value; }

function showError(msg){
document.getElementById("error").innerText = msg;
}

function showApp(){
document.getElementById("authSection").classList.add("hidden");
document.getElementById("appSection").classList.remove("hidden");

if(!demoMode){
getDoc(doc(db,"users",auth.currentUser.uid)).then(docSnap=>{
if(docSnap.data().role==="employer"){
document.getElementById("employerPanel").classList.remove("hidden");
}
});
}else{
if(currentUser.role==="employer"){
document.getElementById("employerPanel").classList.remove("hidden");
}
}
}

function showAuth(){
document.getElementById("authSection").classList.remove("hidden");
document.getElementById("appSection").classList.add("hidden");
}

// DEMO BUTTONS
window.fillWorker = ()=>{
document.getElementById("email").value="worker@test.com";
document.getElementById("password").value="123456";
};

window.fillEmployer = ()=>{
document.getElementById("email").value="employer@test.com";
document.getElementById("password").value="123456";
};

</script>

</body>
</html>
